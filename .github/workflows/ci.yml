name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, '1.77.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      - name: Format, test and build offline
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy CARGO_HTTP_PROXY
          cargo +${{ matrix.rust }} fmt --all -- --check
          cargo +${{ matrix.rust }} test --all-targets --offline
          cargo +${{ matrix.rust }} clippy --all-targets --offline -- -D warnings
          cargo +${{ matrix.rust }} build --release --offline
      - name: Integration checks
        run: python3 scripts/verify.py --dir ./ci-data --io-modes buffered
